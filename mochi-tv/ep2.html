k(C, 1.62, { y: FLOOR }); k(C, 1.72, { y: FLOOR - 28 }, 'oq'); k(C, 1.84, { y: FLOOR }, 'iq');

k(C, 2.3, { eyeS: 1.15, pupS: 1.25, mouthO: .25, smile: .8, browY: 0, browA: 0, turn: .5, lookX: 1, lookY: -.35, tailWag: 1 });

k(C, 4.6, { x: 360, y: FLOOR }); k(C, 4.66, { sy: 1.1, sx: .93, aR: 168, aL: 162, bR: -.1, bL: -.1 }, 'o');
k(C, 4.9, { y: FLOOR - 230 }, 'oq'); k(C, 4.9, { x: 395 }, 'lin'); k(C, 5.2, { y: FLOOR }, 'iq'); k(C, 5.2, { x: 420 }, 'lin');
k(C, 4.88, { happy: 0, smile: .8, mouthO: .1, lookY: -.35 }); k(C, 4.98, { happy: 1, smile: 1, mouthO: .5, lookY: -.6 }, 'back');

// salto 2 (pop 6.2)

k(C, 5.72, { sy: .9, sx: 1.04 }); k(C, 5.87, { sy: .72, sx: 1.16, aR: -60, aL: 50 });
k(C, 5.9, { x: 420, y: FLOOR }); k(C, 5.96, { sy: 1.1, sx: .93, aR: 168, aL: 162 }, 'o');
k(C, 6.2, { y: FLOOR - 240 }, 'oq'); k(C, 6.2, { x: 385 }, 'lin'); k(C, 6.5, { y: FLOOR }, 'iq'); k(C, 6.5, { x: 345 }, 'lin');
k(C, 6.18, { happy: 0, mouthO: .2 }); k(C, 6.28, { happy: 1, mouthO: .5, smile: 1 }, 'back');
k(C, 6.3, { sy: 1, sx: 1 }); k(C, 6.6, { aR: -25, aL: 30, happy: 1 }); k(C, 6.75, { happy: 0, mouthO: .2 });
// salto 3 (pop 7.5)
k(C, 6.8, { turn: -.6 }); k(C, 6.92, { turn: .5 });
k(C, 7.02, { sy: .9, sx: 1.04 }); k(C, 7.17, { sy: .72, sx: 1.16, aR: -60, aL: 50 });
k(C, 7.2, { x: 345, y: FLOOR }); k(C, 7.26, { sy: 1.1, sx: .93, aR: 168, aL: 162 }, 'o');
k(C, 7.5, { y: FLOOR - 250 }, 'oq'); k(C, 7.5, { x: 380 }, 'lin'); k(C, 7.8, { y: FLOOR }, 'iq'); k(C, 7.8, { x: 410 }, 'lin');
k(C, 7.48, { happy: 0, mouthO: .2 }); k(C, 7.58, { happy: 1, mouthO: .5, smile: 1 }, 'back');
k(C, 7.6, { sy: 1, sx: 1 }); k(C, 7.88, { aR: -25, aL: 30 }); k(C, 7.92, { happy: 0, mouthO: .2, browA: -.6 });
// salto 4: la dorada se escapa... ¡al suelo!
k(C, 7.95, { sy: .9, sx: 1.04 }); k(C, 8.17, { sy: .68, sx: 1.18, aR: -70, aL: 55 });
k(C, 8.2, { x: 410, y: FLOOR, lean: 0 }); k(C, 8.27, { sy: 1.12, sx: .92, aR: 172, aL: 165, rR: 1.25, rL: 1.2 }, 'o');
k(C, 8.55, { y: FLOOR - 330 }, 'oq'); k(C, 8.55, { x: 470 }, 'lin');
k(C, 8.45, { eyeS: 1, pupS: 1.25, mouthO: .2, browA: -.6 }); k(C, 8.56, { eyeS: 1.32, pupS: .55, mouthO: .6, browA: .7, browY: -1, smile: -.2 }, 'back');
k(C, 8.6, { lean: 0, sy: 1, sx: 1 }); k(C, 8.9, { y: FLOOR, lean: .85 }, 'iq'); k(C, 8.9, { x: 450 }, 'lin');

k(C, 19.3, { x: G0.x - 59, y: G0.y - 333 + DY }); k(C, 19.75, { y: FLOOR }, 'iq'); k(C, 19.75, { x: 455 }, 'io');
k(C, 19.75, { sy: 1, sx: 1 }); k(C, 19.95, { sy: 1, sx: 1 }); k(C, 20.02, { sy: .86, sx: 1.08 }, 'o'); k(C, 20.25, { sy: 1, sx: 1 }, 'back');
k(C, 19.8, { turn: .3 });
// se ríen juntos

k(C, 20.25, { happy: 1, mouthO: .55, smile: 1, eyeS: 1, pupS: 1, browA: 0, browY: 0, aR: -55, aL: -55, bR: .9, bL: .9, sway: .05, tailWag: 1 }, 'back');

k(C, 21.75, { happy: 0, mouthO: .1, smile: .4, sway: 0, lookX: .6, lookY: -1, hLift: .4, eyeS: 1.1, aR: -12, aL: -12, bR: .3, bL: .3 });

k(C, 23.38, { happy: 0, mouthO: .1 }); k(C, 23.5, { happy: 1, mouthO: .55, smile: 1, sway: .05, hLift: 0, lookY: 0, eyeS: 1 }, 'back');

const SIM_C = simulate(C);

function groundAt(x, y, t) { return y < FLOOR - 100 && t > 19.9 && t < 24.9 && Math.abs(x - 478) < 60 ? y + 2 : FLOOR; }
function catNose(t) {
  const g = geom(C, SIM_C, t), P = g.P, S = g.S, tr = g.tr;
  const hx = CAT_RIG.head[0] + tr * 10 + S.hx * g.face, hy = CAT_RIG.head[1] + S.hy * .8 - P.earDroop * 6;
  const fx = tr * 26, fy = -P.hLift * 16 + P.lookY * 2;
  return toW(g, hx + fx, hy + 30 + fy * .6 - 12);
}
function pipNose(t) {
  const g = geom(M, SIM_M, t, MS), P = g.P, S = g.S, tr = g.tr;
  const hx = MOUSE_RIG.head[0] + tr * 8 + S.hx * g.face / MS, hy = MOUSE_RIG.head[1] + S.hy * .8 / MS;
  const fx = tr * 20, fy = -P.hLift * 14, snX = fx + 30 + tr * 18;
  return toW(g, hx + snX + 26, hy + 12 + fy * .5);
}

// =====================================================================
//  POMPAS
// =====================================================================
function bubble(x, y, r, t, seed, a = 1, gold = 0) {
  if (r < 1 || a <= .01) return;
  const wx = 1 + Math.sin(t * 5 + seed) * .045, wy = 1 + Math.cos(t * 5.6 + seed) * .045;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(wx, wy);
  const g = ctx.createRadialGradient(-r * .3, -r * .3, r * .1, 0, 0, r);
  g.addColorStop(0, gold ? 'rgba(255,240,170,.12)' : 'rgba(255,255,255,.04)'); g.addColorStop(.72, gold ? 'rgba(255,220,120,.16)' : 'rgba(210,240,255,.1)'); g.addColorStop(1, 'rgba(255,255,255,.42)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  const cg = ctx.createConicGradient(t * .9 + seed, 0, 0);
  const cols = gold ? ['rgba(255,210,80,.95)', 'rgba(255,170,60,.9)', 'rgba(255,240,150,.95)', 'rgba(255,190,90,.9)', 'rgba(255,210,80,.95)']
                    : ['rgba(255,140,200,.75)', 'rgba(255,230,120,.75)', 'rgba(120,230,255,.75)', 'rgba(180,140,255,.75)', 'rgba(255,140,200,.75)'];
  cols.forEach((c, i) => cg.addColorStop(i / 4, c));
  ctx.lineWidth = Math.max(2.5, r * .055); ctx.strokeStyle = cg; ctx.stroke();

// trayectorias deterministas
const CACHE = new Map();
const memo = (key, fn) => { if (!CACHE.has(key)) CACHE.set(key, fn()); return CACHE.get(key); };
const wob = (t, s, amp) => ({ x: Math.sin(t * 2.3 + s) * amp, y: Math.cos(t * 1.9 + s * 1.7) * amp * .6 });

const POPS = [4.9, 6.2, 7.5];
const popPoint = tp => memo('pp' + tp, () => { const h = hands(geom(C, SIM_C, tp), CAT_RIG).mid; return { x: h.x, y: h.y - 22 }; });
const ringMemo = t => memo('r' + t.toFixed(3), () => ringAt(t));

function drawBubbles(t) {
  // corriente de pompas mientras Pip sopla
  for (let i = 0, ts = .1; ts < 8.4; i++, ts = .1 + i * .21) {
    const L = 2.2 + rnd(i) * 2.2, age = t - ts;
    if (age < 0 || age > L + .3) continue;
    const r0 = ringMemo(ts), R = 16 + rnd(i + 3) * 26;
    const vx = r0.face * (90 + rnd(i + 7) * 130), vy = -(40 + rnd(i + 11) * 110);
    const x = r0.x + vx * age + Math.sin(age * 2.6 + i) * 22, y = r0.y + vy * age + Math.cos(age * 2 + i) * 10;
    if (age < L) bubble(x, y, R * E.o(clamp(age / .3)), t, i);

  }
  // pompa del principio (le explota en la nariz)
  if (t < 1.6) {

    const p = pathBubble(t, -.3, 1.6, { x: nose.x + 230, y: nose.y - 70 }, nose, 1, 18);

  } else popFx(memo('nose', () => catNose(1.6)).x, memo('nose', () => catNose(1.6)).y, 36, (t - 1.6) / .35);
  // tres pompas que caza

    const to = popPoint(tp), from = ringMemo(tp - 2.1);

    const p = t < 8.45 ? pathBubble(t, 6.3, 8.45, from, near, 3, 24) : pathBubble(t, 8.45, 10.4, near, { x: 860, y: 430 }, 3, 30);

    const p = pathBubble(t, 21.55, 23.15, { x: 760, y: 640 }, { x: nose.x, y: nose.y - 26 }, 8, 34);
    bubble(p.x, p.y, 30, t, 11, 1, 1);
  } else if (t >= 23.15) { const n = memo('pnose', () => pipNose(23.15)); popFx(n.x, n.y - 26, 30, (t - 23.15) / .35, 1); }
}

// varita de pompas (en la mano de Pip)

// =====================================================================
//  ESCENARIO: JARDÍN (capas con paralaje)
// =====================================================================
const FAR = { x0: -1000, y0: -1400, w: 3100, h: 3200 }, NEAR = { x0: -1000, y0: 1000, w: 3100, h: 520 };

function cloud(x, y, s) { for (const [dx, dy, r] of [[0, 0, 60], [55, -22, 50], [-55, 8, 44], [105, 10, 40], [-100, 18, 32]]) { ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 7); ctx.fill(); } }

    ctx.fillStyle = '#b5e69a'; ctx.beginPath(); ctx.ellipse(250, 1330, 900, 260, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#9ad884'; ctx.beginPath(); ctx.ellipse(1300, 1350, 900, 280, 0, 0, 7); ctx.fill();

// =====================================================================
//  CÁMARA
// =====================================================================
function cam2d(t) {
  const F = [2.5, 400, 1290], A = [1.55, 590, 1215], B = [1.7, 625, 1265], C1 = [1.28, 600, 1110], D = [1.6, 520, 1240], Ez = [2.0, 500, 1165], Z = [1.7, 520, 1200];
  const mix = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));
  let c;
  if (t < 1.85) c = F;
  else if (t < 2.7) c = mix(F, A, E.io(seg(t, 1.85, 2.7)));
  else if (t < 10.3) c = A;
  else if (t < 11.1) c = mix(A, B, E.io(seg(t, 10.3, 11.1)));
  else if (t < 13.6) c = B;
  else if (t < 15.4) c = mix(B, C1, E.io(seg(t, 13.6, 15.4)));
  else if (t < 19.35) c = C1;
  else if (t < 20.2) c = mix(C1, D, E.io(seg(t, 19.35, 20.2)));
  else if (t < 21.4) c = D;
  else if (t < 22.3) c = mix(D, Ez, E.io(seg(t, 21.4, 22.3)));
  else if (t < 23.55) c = Ez;
  else c = mix(Ez, Z, E.io(seg(t, 23.55, 25)));
  let shake = 0;
  if (t > 8.9 && t < 9.2) shake = 10 * (1 - seg(t, 8.9, 9.2));
  if (t > 19.75 && t < 20.1) shake = 9 * (1 - seg(t, 19.75, 20.1));
  return { s: c[0], cx: c[1] + Math.sin(t * 70) * shake, cy: c[2] + Math.cos(t * 61) * shake };
}

//  FOTOGRAMA

function drawWorld(t) {

}

function drawOverlay(c, t) {

    if (t > 23.95) caption(c, 'PART 3 ⏳', t, 23.95, 25.01, { size: 70, y: 440 });
  }
}
